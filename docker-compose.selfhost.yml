name: chronicle-selfhost

services:
  web:
    build: ./web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-chronicle}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./api
    restart: unless-stopped
    env_file: ${SELFHOST_ENV_FILE:-.env.selfhost}
    environment:
      DATABASE_URL: postgres://chronicle:${POSTGRES_PASSWORD}@postgres:5432/chronicle?sslmode=disable
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost}
      API_BASE_URL: ${PUBLIC_URL:-http://localhost}/api
      WEBAUTHN_RP_ORIGIN: ${PUBLIC_URL:-http://localhost}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-chronicle}
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OBJECT_STORAGE_PUBLIC_BASE_URL: ${PUBLIC_URL:-http://localhost}/media
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    build: ./api
    restart: "no"
    env_file: ${SELFHOST_ENV_FILE:-.env.selfhost}
    environment:
      DATABASE_URL: postgres://chronicle:${POSTGRES_PASSWORD}@postgres:5432/chronicle?sslmode=disable
    command: ["./migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chronicle
      POSTGRES_USER: chronicle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronicle -d chronicle"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$OBJECT_STORAGE_BUCKET" &&
        mc anonymous set download "local/$$OBJECT_STORAGE_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-chronicle}
    depends_on:
      minio:
        condition: service_healthy

  ragsvc:
    profiles: ["rag"]
    build: ./ragsvc
    restart: unless-stopped
    env_file: ${SELFHOST_ENV_FILE:-.env.selfhost}
    environment:
      DATABASE_URL: postgres://chronicle:${POSTGRES_PASSWORD}@postgres:5432/chronicle?sslmode=disable
      RAG_PORT: "5400"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5400/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
