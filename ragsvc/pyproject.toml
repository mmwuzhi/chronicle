[project]
name = "ragsvc"
version = "0.1.0"
description = "Chronicle RAG sidecar — embeddings, hybrid retrieval, query-time analysis over captures"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "numpy>=2.0",
    "ollama>=0.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0", "torch>=2.2"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
